<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — StudyMate AI</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Anti-flash theme initialization -->
    <script>
        (function() {
            var theme = localStorage.getItem('studymate_theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Theme Toggle Button -->
            <button id="theme-toggle-btn" class="theme-toggle-btn theme-toggle-auth" type="button" aria-label="Switch to Dark Mode" title="Switch to Dark Mode">
                <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <!-- Brand Header -->
            <div class="auth-brand-header">
                <div class="brand-icon auth-logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">Join StudyMate AI for smarter college study sessions</p>
            </div>

            <!-- Error Banner -->
            {% if error %}
            <div class="auth-alert error-alert" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Registration Form -->
            <form action="{{ url_for('auth_bp.register') }}" method="POST" class="auth-form" autocomplete="on">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="full_name" 
                        name="full_name" 
                        class="form-input" 
                        placeholder="Alex Morgan" 
                        value="{{ full_name or '' }}" 
                        required 
                        autocomplete="name"
                        autofocus>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="alex@college.edu" 
                        value="{{ email or '' }}" 
                        required 
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password <span class="label-hint">(min. 8 characters)</span></label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Create a strong password" 
                            minlength="8" 
                            required 
                            autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility" title="Show/hide password">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="confirm_password" 
                            name="confirm_password" 
                            class="form-input" 
                            placeholder="Re-enter your password" 
                            minlength="8" 
                            required 
                            autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility" title="Show/hide password">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-auth-primary" id="btn-submit">
                    <span>Create Account</span>
                </button>
            </form>

            <!-- Card Footer -->
            <div class="auth-card-footer">
                <p>Already have an account? <a href="{{ url_for('auth_bp.login') }}" class="auth-link">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggles
        document.querySelectorAll('.btn-toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.closest('.password-input-wrapper').querySelector('input');
                const isPassword = input.getAttribute('type') === 'password';
                input.setAttribute('type', isPassword ? 'text' : 'password');
                this.style.color = isPassword ? 'var(--accent-indigo)' : 'var(--text-muted)';
            });
        });

        // Submit button loading state
        const form = document.querySelector('.auth-form');
        const submitBtn = document.getElementById('btn-submit');
        if (form && submitBtn) {
            form.addEventListener('submit', () => {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Creating Account...</span>';
            });
        }

        // Theme Toggle Support
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        if (themeToggleBtn) {
            function updateThemeToggleLabel(t) {
                const next = t === 'light' ? 'Dark' : 'Light';
                themeToggleBtn.setAttribute('aria-label', `Switch to ${next} Mode`);
                themeToggleBtn.setAttribute('title', `Switch to ${next} Mode`);
            }
            const activeTheme = document.documentElement.getAttribute('data-theme') || 'light';
            updateThemeToggleLabel(activeTheme);
            themeToggleBtn.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme') || 'light';
                const next = current === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('studymate_theme', next);
                updateThemeToggleLabel(next);
            });
        }
    </script>
</body>
</html>
